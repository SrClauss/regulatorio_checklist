version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: claudio_db
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=claudio_regulatoria
    volumes:
      - mongo_data:/data/db
    expose:
      - 27017

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claudio_backend
    restart: always
    environment:
      - MONGODB_URI=mongodb://db:27017
      - DB_NAME=claudio_regulatoria
      - JWT_SECRET=sua_chave_secreta_super_segura_para_fastapi_jwt_2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - VAPID_CLAIM_EMAIL=mailto:roberto@consultoria.com.br
      - VAPID_PUBLIC_KEY=BDJzzdCJdKqVFhcHAFEMBns7D5cm6rsVMPf321nJmmvx0slgNBPVuyDiCo-SDQdBeBpuqSlNrUMsnFqj9R5h8sE
      - VAPID_PRIVATE_KEY=ags1tWHDgQLxN49rwsO2UAtMqoV5xc189JXjaFO_Wwg
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=evidencias
      - MINIO_SECURE=false
    depends_on:
      - db
      - minio
    volumes:
      - uploads_data:/app/backend/uploads/comprovantes
    expose:
      - 8000

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: claudio_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claudio_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro


volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  minio_data:
    driver: local
