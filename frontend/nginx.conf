server {
    listen 80;
    server_name arkana.fun www.arkana.fun localhost 2.25.170.196;

    # Limite máximo de tamanho do corpo da requisição (permite uploads de comprovantes de até 20MB)
    client_max_body_size 20M;

    # Servir o Frontend Estático (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para as rotas da API no Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir Comprovantes Estáticos diretamente do volume compartilhado (Alta Performance)
    location /static/comprovantes {
        alias /usr/share/nginx/html/uploads;
        autoindex off;
        try_files $uri =404;
    }
}
