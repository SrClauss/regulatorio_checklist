server {
    listen 80;
    server_name arkana.fun www.arkana.fun localhost 2.25.170.196;

    # Desafio ACME do Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionamento automático de HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arkana.fun www.arkana.fun localhost 2.25.170.196;

    # Caminho dos certificados SSL
    ssl_certificate /etc/letsencrypt/live/arkana.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkana.fun/privkey.pem;

    # Configurações de Segurança do SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Limite máximo de tamanho do corpo da requisição (permite uploads de comprovantes de até 20MB)
    client_max_body_size 20M;

    # Servir o Frontend Estático (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para as rotas da API no Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir Comprovantes Estáticos diretamente do volume compartilhado
    location /static/comprovantes {
        alias /usr/share/nginx/html/uploads;
        autoindex off;
        try_files $uri =404;
    }
}
